<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Plume — banc d'essai de mise en page</title>
    <script type="module">
      import "/src/App.css";
      import "katex/dist/katex.min.css";
    </script>
  </head>
  <body>
    <!-- Mirrors the deep-view DOM exactly, so widths can be measured without
         needing Tauri data. Dev-only: delete once the layout is settled. -->
    <div class="shell">
      <nav class="sidebar"><div class="sidebar__brand"><span class="sidebar__wordmark">Plume</span></div></nav>
      <main class="content">
        <div class="stack" style="max-width:620px">
          <section class="stack stack--tight">
            <h2 class="section-title">Lecture des pages</h2>
            <ol class="scan">
              <li class="scan__row scan__row--done">
                <span class="scan__thumb" style="background:#e8e4dc"></span>
                <div class="scan__body">
                  <span class="scan__title">Page 1</span>
                  <span class="scan__label">7 blocs</span>
                </div>
                <span class="scan__dot scan__dot--done"></span>
              </li>
              <li class="scan__row scan__row--reading">
                <span class="scan__thumb" style="background:#e8e4dc"></span>
                <div class="scan__body">
                  <span class="scan__title">Page 2</span>
                  <span class="scan__label">Examine la photo…</span>
                </div>
                <span class="scan__dot scan__dot--reading"></span>
              </li>
              <li class="scan__row scan__row--reading">
                <span class="scan__thumb" style="background:#e8e4dc"></span>
                <div class="scan__body">
                  <span class="scan__title">Page 3</span>
                  <span class="scan__label">Met les blocs en forme…</span>
                </div>
                <span class="scan__dot scan__dot--reading"></span>
              </li>
              <li class="scan__row scan__row--waiting">
                <span class="scan__thumb" style="background:#e8e4dc"></span>
                <div class="scan__body">
                  <span class="scan__title">Page 4</span>
                  <span class="scan__label">En attente</span>
                </div>
                <span class="scan__dot scan__dot--waiting"></span>
              </li>
            </ol>
            <p class="notice">Page 1 sur 4 — 0,11 $ cumulés.</p>
          </section>
        </div>
      </main>
    </div>

    <script type="module">
      window.measure = () => {
        const pick = (sel) => {
          const el = document.querySelector(sel);
          if (!el) return null;
          const r = el.getBoundingClientRect();
          return {
            sel,
            width: Math.round(r.width),
            right: Math.round(r.right),
            scrollWidth: el.scrollWidth,
            overflows: el.scrollWidth > Math.ceil(r.width) + 1,
          };
        };
        return {
          viewport: window.innerWidth,
          docScrollWidth: document.documentElement.scrollWidth,
          nodes: [
            ".deep",
            ".workspace",
            ".workspace__bar",
            ".workspace__body",
            ".review",
            ".review__bar",
            ".review__split",
            ".review__paper",
            ".paper",
          ].map(pick),
        };
      };
    </script>
  </body>
</html>
