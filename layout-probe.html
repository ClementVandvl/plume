<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Plume — banc d'essai de mise en page</title>
    <script type="module">
      import "/src/App.css";
      import "katex/dist/katex.min.css";
    </script>
  </head>
  <body>
    <!-- Mirrors the deep-view DOM exactly, so widths can be measured without
         needing Tauri data. Dev-only: delete once the layout is settled. -->
    <div class="shell">
      <nav class="sidebar"><div class="sidebar__brand"><span class="sidebar__wordmark">Plume</span></div></nav>
      <main class="content">
        <div class="modal" style="position:static; width:min(560px,100%)">
          <header class="modal__head">
            <div><h2 class="modal__title">Réglages</h2></div>
          </header>
          <div class="modal__body">
            <section class="stack stack--tight">
              <h3 class="section-title">Mises à jour</h3>
              <div class="update">
                <div class="update__row">
                  <div class="update__identity">
                    <span class="update__name">Plume 0.1.1</span>
                    <span class="update__status">Plume est à jour.</span>
                  </div>
                  <button class="btn btn--ghost">Rechercher</button>
                </div>
                <label class="check update__auto">
                  <input type="checkbox" checked>
                  Rechercher automatiquement au démarrage
                </label>
              </div>
            </section>

            <section class="stack stack--tight">
              <h3 class="section-title">Mises à jour — version disponible</h3>
              <div class="update">
                <div class="update__row">
                  <div class="update__identity">
                    <span class="update__name">Plume 0.1.1</span>
                    <span class="update__status update__status--highlight">Version 0.1.2 disponible — publiée le 2026-08-24.</span>
                  </div>
                  <button class="btn btn--primary">Installer 0.1.2</button>
                </div>
                <pre class="release-notes">Corrige la lecture sur les machines de 8 Go.
Les fenêtres de console n'apparaissent plus sous Windows.</pre>
                <label class="check update__auto">
                  <input type="checkbox" checked>
                  Rechercher automatiquement au démarrage
                </label>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>

    <script type="module">
      window.measure = () => {
        const pick = (sel) => {
          const el = document.querySelector(sel);
          if (!el) return null;
          const r = el.getBoundingClientRect();
          return {
            sel,
            width: Math.round(r.width),
            right: Math.round(r.right),
            scrollWidth: el.scrollWidth,
            overflows: el.scrollWidth > Math.ceil(r.width) + 1,
          };
        };
        return {
          viewport: window.innerWidth,
          docScrollWidth: document.documentElement.scrollWidth,
          nodes: [
            ".deep",
            ".workspace",
            ".workspace__bar",
            ".workspace__body",
            ".review",
            ".review__bar",
            ".review__split",
            ".review__paper",
            ".paper",
          ].map(pick),
        };
      };
    </script>
  </body>
</html>
