name: release

# Windows and Linux packages cannot be produced on a Mac: Tauri's installers
# (NSIS, WiX, deb) run on their own platform, and the Windows target needs the
# MSVC toolchain. Each runner therefore builds its own.

on:
  workflow_dispatch:
    inputs:
      macos_arm:
        description: "macOS — Apple Silicon"
        type: boolean
        default: true
      macos_intel:
        description: "macOS — Intel"
        type: boolean
        default: false
      windows:
        description: "Windows"
        type: boolean
        default: true
      linux:
        description: "Linux"
        type: boolean
        default: false
      publish:
        description: "Créer une release brouillon (sinon : artefacts de run)"
        type: boolean
        default: false
      version:
        description: "Version, ex. v0.1.0 — requise si publication"
        type: string
        required: false
  push:
    tags:
      - "v*"

jobs:
  # A matrix cannot be filtered by inputs in place, so it is computed first.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      any: ${{ steps.targets.outputs.any }}
      tag: ${{ steps.targets.outputs.tag }}
    steps:
      - id: targets
        shell: bash
        run: |
          set -euo pipefail

          # A tag push always builds and releases everything; a manual run
          # builds only what was ticked.
          if [ "${{ github.event_name }}" = "push" ]; then
            mac_arm=true; mac_intel=true; win=true; lin=true
            tag="${{ github.ref_name }}"
          else
            mac_arm="${{ inputs.macos_arm }}"
            mac_intel="${{ inputs.macos_intel }}"
            win="${{ inputs.windows }}"
            lin="${{ inputs.linux }}"
            # An empty tag tells tauri-action to build without releasing.
            tag=""
            if [ "${{ inputs.publish }}" = "true" ]; then
              tag="${{ inputs.version }}"
              if [ -z "$tag" ]; then
                echo "::error::Cochez une version (ex. v0.1.0) pour publier."
                exit 1
              fi
            fi
          fi

          entries=""
          add() { entries="${entries:+$entries,}$1"; }

          [ "$mac_arm" = "true" ] && add '{"platform":"macos-latest","target":"aarch64-apple-darwin","label":"macOS (Apple Silicon)"}'
          [ "$mac_intel" = "true" ] && add '{"platform":"macos-latest","target":"x86_64-apple-darwin","label":"macOS (Intel)"}'
          [ "$win" = "true" ] && add '{"platform":"windows-latest","target":"x86_64-pc-windows-msvc","label":"Windows"}'
          [ "$lin" = "true" ] && add '{"platform":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","label":"Linux"}'

          if [ -z "$entries" ]; then
            echo "::error::Aucune plateforme cochée."
            exit 1
          fi

          echo "matrix=[$entries]" >> "$GITHUB_OUTPUT"
          echo "any=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Plateformes : $entries"

  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}

    # Read at job level so a step can ask whether signing is configured at all.
    env:
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # WebKit and the packaging tools Tauri needs on Linux.
      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev

      - run: npm ci

      # The same gate as local development: tokens, tests, types.
      - run: npm run build

      - run: cargo test --manifest-path src-tauri/Cargo.toml

      # Two steps rather than one, because an env key cannot be omitted
      # conditionally. Passing APPLE_CERTIFICATE unconditionally made the
      # bundler try to import a certificate that was not there:
      # "security import: failed to import keychain certificate".
      - name: Empaqueter et signer
        if: env.HAS_APPLE_CERTIFICATE != ''
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          # Empty tag: build only, no release. That is what a platform trial run
          # should do — a Windows check has no business opening a release.
          tagName: ${{ needs.plan.outputs.tag }}
          releaseName: Plume ${{ needs.plan.outputs.tag }}
          releaseBody: |
            Téléchargez le fichier correspondant à votre machine.

            - **macOS** : `.dmg`
            - **Windows** : `.exe` (installateur)
            - **Linux** : `.AppImage` ou `.deb`
          releaseDraft: true
          prerelease: false
          # Publishes latest.json beside the packages: the manifest the app
          # polls. Without it, nothing can find an update.
          includeUpdaterJson: true

      - name: Empaqueter
        if: env.HAS_APPLE_CERTIFICATE == ''
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Update signing is unrelated to code signing and stays on.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }}
          # Empty tag: build only, no release. That is what a platform trial run
          # should do — a Windows check has no business opening a release.
          tagName: ${{ needs.plan.outputs.tag }}
          releaseName: Plume ${{ needs.plan.outputs.tag }}
          releaseBody: |
            Téléchargez le fichier correspondant à votre machine.

            - **macOS** : `.dmg`
            - **Windows** : `.exe` (installateur)
            - **Linux** : `.AppImage` ou `.deb`
          releaseDraft: true
          prerelease: false
          # Publishes latest.json beside the packages: the manifest the app
          # polls. Without it, nothing can find an update.
          includeUpdaterJson: true

      # The run itself never said where the packages went, which read as "no
      # draft appeared" when the publish box was simply unticked.
      - name: Résumé
        shell: bash
        run: |
          {
            if [ -n "${{ needs.plan.outputs.tag }}" ]; then
              echo "### Release brouillon ${{ needs.plan.outputs.tag }}"
              echo ""
              echo "Les paquets de **${{ matrix.label }}** sont attachés au brouillon :"
              echo "https://github.com/${{ github.repository }}/releases"
              echo ""
              echo "Un brouillon n'apparaît ni dans l'encart Releases de la page"
              echo "d'accueil, ni pour les visiteurs — seulement sur la page des"
              echo "releases, en haut, avec l'étiquette « Draft »."
            else
              echo "### Essai sans publication"
              echo ""
              echo "« Créer une release brouillon » n'était pas coché : les paquets de"
              echo "**${{ matrix.label }}** sont dans les artefacts de ce run"
              echo "(section Artifacts, en bas de cette page). Aucune release n'a été créée."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Without a release, the packages would otherwise be thrown away with the
      # runner. Attached to the run instead, so a trial build is still testable.
      #
      # Globbing the bundle directory rather than reading the action's output:
      # a path list needs newline separators, which a GitHub expression cannot
      # produce cleanly.
      - name: Attacher les paquets au run
        if: needs.plan.outputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: plume-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.zip
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
            !src-tauri/target/**/bundle/**/rw.*.dmg
          if-no-files-found: error
          retention-days: 14
